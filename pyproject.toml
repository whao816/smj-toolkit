[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smj-toolkit"
version = "0.2.2rc1"
description = "Single-molecule junction transport workflow (standalone)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "AgenticDFT contributors" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6,<7", "numpy>=1.24"]
keywords = ["single-molecule junction", "transport", "FHI-aims", "aitranss", "DFT"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
smj = "smj.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["smj*"]

[tool.setuptools.package-data]
"smj.junction" = ["templates/*", "PROVENANCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider -m \"not integration\""
markers = [
    "integration: 依赖 runs/ 真实资产的重资产回归（默认排除，用 -m integration 运行）",
]
