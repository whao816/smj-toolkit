# AIMS molecule-opt acceptance (2026-11-13):
#   molecule opt: FHI-aims PBE/light (same stack as tip/SCF)
#   tip: all-atom relax, no Au-S constraint
#   au60_build: expand tips into full pyramids; geometry frozen afterwards
run:
  name: 2CN-656-4-thiomethylphenyl-aimsopt
  dir: .
  mode: slurm-ssh
  clean: false
  keep_going: false

molecule:
  xyz: molecule.xyz
  charge: 0
  multiplicity: 1
  opt_engine: aims
  opt_functional: pbe
  opt_basis: light
  opt_force_threshold: 1.e-2
  method: b3lyp
  basis: 6-31g(d)
  family: null

electrode:
  source: library
  library_dir: /data/apps/src/fhi-aims.221103/src/aitranss/electrodes.library
  library_cluster: fcc111.au.clusters.37_atoms/fcc111.cluster.natoms37.x1.aims
  left_anchor: S
  right_anchor: S
  au_tip_distance: 2.35
  anchor_au_s_target: null
  pin_contact: false
  strip_thiol_h: false
  vdw: true
  nlayers: null
  relax: false
  relax_force_threshold: 1.e-2
  relax_freeze: backplane

transport:
  temperature: 300.0
  energy_window: [-0.22, 0.0002, -0.16]
  require_te_out: true

cluster:
  host: gpu-outside
  user: haow
  port: 22
  remote_root: /home/haow/smj-runs
  partition: main
  ntasks: 8
  gres: gpu:1
  mem: 24G
  time_limit: 06:00:00
  poll_seconds: 30
  timeout_hours: 8
  species_dir: D:/dsh_projects/AutoSMJ/demo/2CN-656-4-thiomethylphenyl-aimsopt/species
  env:
    aims_bin: /data/apps/fhi-aims.221103-cuda12.8-oneapi2025.3/bin/aims.221103.scalapack.mpi.x
    aims_ld_module: fhi-aims/221103-cuda12.8-oneapi2025.3
    aitranss_bin: /data/apps/fhi-aims.221103-cuda12.8-oneapi2025.3/bin/aitranss.071813.openmp.ifx2025.3.x
    mkl_lib: /opt/intel/oneapi/2025.3/lib
    g16_module: Gaussian/g16.c02
    g16_scratch: /data/tmp/g16-scratch/smj-2cn656-aimsopt
    nproc: 8
    g16_mem: 24G
    g16_walltime: 04:00:00
    te_gres: gpu:0
    te_mem: 8G
    te_walltime: 02:00:00

paths:
  species_defaults: D:/dsh_projects/AutoSMJ/demo/2CN-656-4-thiomethylphenyl-aimsopt/species

review:
  require_a2: true
  a2_deviation: 0.15
