name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  tests:
    name: pytest / py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest -q

  kernel:
    name: kernel provenance (PROVENANCE.json sha256 + local change log)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PROVENANCE.json must match kernel files on disk
        run: python scripts/gen_junction_provenance.py --check

  demo:
    name: demo spectra regression (G/G0, S, ZT)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and pytest
        # demo 回归只走 landauer 积分与容差比对，不需要 matplotlib/rdkit；
        # 但下一步要用 pytest，必须把 dev extra 一起装上（2026-11-20：漏装后
        # `python -m pytest` 直接 ModuleNotFoundError，job 一直红）。
        run: python -m pip install -e ".[dev]"
      - name: demo-reference.json must match the spectra and the integrator
        # 失败原因写进 annotation：匿名看不了 Actions 日志时，check-run 的
        # annotations 是唯一还能拿到的一句话结论（2026-11-20 排查用）。
        shell: bash
        run: |
          set +e
          python scripts/gen_demo_reference.py --check 2>&1 | tee /tmp/demo-check.log
          rc=${PIPESTATUS[0]}
          summary=$(tail -c 900 /tmp/demo-check.log | tr '\n' ' ')
          if [ "$rc" -eq 0 ]; then
            echo "::notice title=demo-reference::${summary}"
          else
            echo "::error title=demo-reference::${summary}"
          fi
          exit "$rc"
      - name: Recompute demo transport quantities
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_demo_regression.py --tb=line 2>&1 | tee /tmp/demo-pytest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            summary=$(grep -E '^(FAILED|ERROR)' /tmp/demo-pytest.log | head -n 5 | tr '\n' ' ')
            if [ -z "$summary" ]; then
              summary=$(tail -c 900 /tmp/demo-pytest.log | tr '\n' ' ')
            fi
            echo "::error title=demo-pytest::${summary}"
          fi
          exit "$rc"

  dist:
    name: build wheel + sdist, install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist (RECORD self-check)
        run: python scripts/build_wheel.py --check --sdist
      - name: Install wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
      - name: Smoke test installed CLI
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          smj --version
          smj verify
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          printf '2\nsmoke molecule\nC 0 0 0\nH 1.09 0 0\n' > molecule.xyz
          smj init . --name smoke --xyz molecule.xyz --mode dry-run
          smj plan -c smj.yaml
      - name: Install from sdist into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv_sdist"
          "$RUNNER_TEMP/venv_sdist/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv_sdist/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/venv_sdist/bin/smj" --version
          "$RUNNER_TEMP/venv_sdist/bin/smj" verify
      - uses: actions/upload-artifact@v4
        with:
          name: smj-toolkit-dist
          path: dist/*
          if-no-files-found: error
